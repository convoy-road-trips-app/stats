# Receives OTLP/HTTP from the demo and serves it in the Prometheus text format.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true # service.name becomes the service_name label

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
