name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
          only-new-issues: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run tests with coverage
        run: make test-cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run benchmarks
        run: make bench

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: make build

      - name: Verify examples build
        run: |
          go build ./examples/...
          go vet ./examples/...
          go vet -tags docker ./examples/docker

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Start Docker services
        run: make integration-up

      - name: Run integration tests
        run: go test -v -count=1 -tags=integration ./test/integration

      - name: Stop Docker services
        if: always()
        run: make integration-down

  # The LGTM collector forwards OTLP metrics to Prometheus' OTLP receiver,
  # which only ingests cumulative sums and histograms. The OTLP exporter now
  # exports cumulative temporality and Shutdown drains buffered metrics, so
  # the series (including histogram _bucket/le) reach the query surface.
  lgtm:
    name: LGTM Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: make lgtm-up
      - run: go test -v -count=1 -tags=integration ./test/integration/lgtm/...
      - if: failure()
        run: docker compose -f test/integration/lgtm/docker-compose.yml logs --tail=100
      - if: always()
        run: make lgtm-down

  # examples/docker: demo -> OTLP/HTTP -> OpenTelemetry Collector -> Prometheus.
  # The test builds the stack, polls Prometheus for every _bucket series and
  # tears it down. It sits behind the `docker` build tag, so `go test ./...`
  # stays hermetic.
  docker-example:
    name: Docker Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: make docker-example-test
      - if: always()
        run: docker compose -f examples/docker/docker-compose.yml down --volumes --remove-orphans
